<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>메모 홈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --color-primary: #3182f6;
    --surface-page: #f2f4f6;
    --surface-card: #ffffff;
    --text-primary: #191f28;
    --text-secondary: #4e5968;
    --text-muted: #8b95a1;
    --text-on-primary: #ffffff;

    --label-blue: #3182f6;
    --label-blue-soft: #e8f3ff;
    --label-green: #12a150;
    --label-green-soft: #e3f8ec;
    --label-orange: #f76808;
    --label-orange-soft: #fff1e5;
    --label-pink: #e5397a;
    --label-pink-soft: #ffeaf1;

    --space-4: 4px;
    --space-8: 8px;
    --space-12: 12px;
    --space-16: 16px;
    --space-20: 20px;
    --space-24: 24px;
    --space-34: 34px;
    --space-64: 64px;
    --radius-sm: 12px;
    --radius-md: 16px;
    --radius-xl: 24px;
    --radius-full: 999px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { background: var(--surface-page); }

  body {
    font-family: "Noto Sans KR", -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    color: var(--text-primary);
    background: var(--surface-page);
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
  }

  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  a { color: inherit; text-decoration: none; }
  svg { display: block; flex: none; }

  /* 화면: 모바일 390px 기준. 더 넓은 화면에서는 가운데에 390px로 고정 */
  .screen {
    width: 100%;
    max-width: 390px;
    min-height: 100vh;
    min-height: 100dvh;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: var(--space-16);
    padding: var(--space-64) var(--space-16) var(--space-34);
    background: var(--surface-page);
  }

  .main {
    flex: 1 0 auto;
    display: flex;
    flex-direction: column;
    gap: var(--space-16);
  }

  /* 헤더 */
  .header {
    display: flex;
    flex-direction: column;
    gap: var(--space-8);
    padding: 0 var(--space-8);
  }
  .header__date {
    font-size: 15px;
    font-weight: 500;
    line-height: 22px;
    letter-spacing: -0.2px;
    color: var(--text-muted);
  }
  .header__title {
    font-size: 28px;
    font-weight: 700;
    line-height: 38px;
    letter-spacing: -0.8px;
    color: var(--text-primary);
  }
  .header__title em { font-style: normal; color: var(--color-primary); }

  /* 분류 칩 */
  .filter {
    display: flex;
    gap: var(--space-8);
    padding: 0 var(--space-4);
    overflow-x: auto;
    scrollbar-width: none;
  }
  .filter::-webkit-scrollbar { display: none; }
  .chip {
    flex: none;
    height: 36px;
    padding: 0 var(--space-16);
    display: flex;
    align-items: center;
    border-radius: var(--radius-full);
    background: var(--surface-card);
    font-size: 15px;
    font-weight: 700;
    line-height: 22px;
    letter-spacing: -0.2px;
    white-space: nowrap;
    color: var(--text-secondary);
  }
  .chip[aria-pressed="true"] {
    background: var(--color-primary);
    color: var(--text-on-primary);
  }

  /* 카드 */
  .card {
    display: flex;
    flex-direction: column;
    padding: var(--space-8) 0;
    border-radius: var(--radius-xl);
    background: var(--surface-card);
  }
  .card__header {
    display: flex;
    align-items: center;
    gap: var(--space-4);
    height: 40px;
    padding: var(--space-12) var(--space-16) var(--space-4) var(--space-20);
  }
  .card__title {
    flex: 1 1 0;
    min-width: 0;
    font-size: 15px;
    font-weight: 700;
    line-height: 22px;
    letter-spacing: -0.2px;
    color: var(--text-primary);
  }
  .card__pin { color: var(--label-blue); }
  .card__action {
    display: flex;
    align-items: center;
    gap: var(--space-4);
    font-size: 15px;
    font-weight: 500;
    line-height: 22px;
    letter-spacing: -0.2px;
    white-space: nowrap;
    color: var(--text-muted);
  }

  /* 메모 한 줄 */
  .memo {
    display: flex;
    align-items: center;
    gap: var(--space-16);
    height: 72px;
    padding: var(--space-12) var(--space-20);
  }
  .memo__tile {
    flex: none;
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: var(--radius-sm);
    background: var(--tile-soft);
    color: var(--tile);
  }
  .memo--blue   { --tile: var(--label-blue);   --tile-soft: var(--label-blue-soft); }
  .memo--green  { --tile: var(--label-green);  --tile-soft: var(--label-green-soft); }
  .memo--orange { --tile: var(--label-orange); --tile-soft: var(--label-orange-soft); }
  .memo--pink   { --tile: var(--label-pink);   --tile-soft: var(--label-pink-soft); }
  .memo__content {
    flex: 1 1 0;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: var(--space-4);
  }
  .memo__title {
    font-size: 17px;
    font-weight: 700;
    line-height: 24px;
    letter-spacing: -0.3px;
    color: var(--text-primary);
    word-break: break-word;
  }
  .memo__preview {
    font-size: 14px;
    font-weight: 400;
    line-height: 20px;
    letter-spacing: -0.1px;
    color: var(--text-secondary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .memo__date {
    flex: none;
    font-size: 13px;
    font-weight: 500;
    line-height: 18px;
    white-space: nowrap;
    color: var(--text-muted);
  }

  /* 주 버튼: 스크롤돼도 화면 아래에 붙는다 */
  .primary {
    position: sticky;
    bottom: var(--space-34);
    flex: none;
    width: 100%;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: var(--space-8);
    padding: 0 var(--space-24);
    border-radius: var(--radius-md);
    background: var(--color-primary);
    color: var(--text-on-primary);
    font-size: 17px;
    font-weight: 700;
    line-height: 24px;
    letter-spacing: -0.2px;
    white-space: nowrap;
  }

  :focus-visible { outline: 2px solid var(--color-primary); outline-offset: 2px; }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="icon-note" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.83333" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6.41667 3.66667H12.8333L16.5 7.33333V18.3333H6.41667V3.66667Z"/>
      <path d="M12.8333 3.66667V7.33333H16.5M9.16667 11H13.75M9.16667 14.6667H13.75"/>
    </symbol>
    <symbol id="icon-pin" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.33333" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 2.33333H10L9.4 5.8L11.3333 8H4.66667L6.6 5.8L6 2.33333Z"/>
      <path d="M8 8V13.3333"/>
    </symbol>
    <symbol id="icon-chevron-right" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.33333" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 4L10 8L6 12"/>
    </symbol>
    <symbol id="icon-plus" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.66667" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10 4.16667V10M10 10V15.8333M10 10H4.16667M10 10H15.8333"/>
    </symbol>
  </defs>
</svg>

<div class="screen">
  <main class="main">
    <header class="header">
      <p class="header__date">10월 30일 금요일</p>
      <h1 class="header__title">오늘까지 메모를<br><em>128개</em> 남겼어요</h1>
    </header>

    <div class="filter" role="group" aria-label="메모 분류">
      <button class="chip" type="button" aria-pressed="true">전체</button>
      <button class="chip" type="button" aria-pressed="false">업무</button>
      <button class="chip" type="button" aria-pressed="false">개인</button>
      <button class="chip" type="button" aria-pressed="false">아이디어</button>
    </div>

    <section class="card" aria-labelledby="pinned-title">
      <div class="card__header">
        <svg class="card__pin" width="16" height="16" aria-hidden="true"><use href="#icon-pin"/></svg>
        <h2 class="card__title" id="pinned-title">고정한 메모</h2>
      </div>
      <a class="memo memo--blue" href="#">
        <span class="memo__tile"><svg width="22" height="22" aria-hidden="true"><use href="#icon-note"/></svg></span>
        <span class="memo__content">
          <span class="memo__title">디자인 리뷰 회의록</span>
          <span class="memo__preview">검수 기준과 다음 할 일 정리</span>
        </span>
        <span class="memo__date">오늘</span>
      </a>
      <a class="memo memo--green" href="#">
        <span class="memo__tile"><svg width="22" height="22" aria-hidden="true"><use href="#icon-note"/></svg></span>
        <span class="memo__content">
          <span class="memo__title">주말 등산 준비</span>
          <span class="memo__preview">물 두 병, 간식, 바람막이 챙기기</span>
        </span>
        <span class="memo__date">어제</span>
      </a>
    </section>

    <section class="card" aria-labelledby="recent-title">
      <div class="card__header">
        <h2 class="card__title" id="recent-title">최근 메모</h2>
        <a class="card__action" href="#">
          전체 보기
          <svg width="16" height="16" aria-hidden="true"><use href="#icon-chevron-right"/></svg>
        </a>
      </div>
      <a class="memo memo--pink" href="#">
        <span class="memo__tile"><svg width="22" height="22" aria-hidden="true"><use href="#icon-note"/></svg></span>
        <span class="memo__content">
          <span class="memo__title">장보기 목록</span>
          <span class="memo__preview">우유, 계란, 사과, 커피 원두</span>
        </span>
        <span class="memo__date">오늘</span>
      </a>
      <a class="memo memo--orange" href="#">
        <span class="memo__tile"><svg width="22" height="22" aria-hidden="true"><use href="#icon-note"/></svg></span>
        <span class="memo__content">
          <span class="memo__title">앱 아이콘 아이디어</span>
          <span class="memo__preview">메모지 모서리가 접힌 모양</span>
        </span>
        <span class="memo__date">오늘</span>
      </a>
      <a class="memo memo--green" href="#">
        <span class="memo__tile"><svg width="22" height="22" aria-hidden="true"><use href="#icon-note"/></svg></span>
        <span class="memo__content">
          <span class="memo__title">읽을 책</span>
          <span class="memo__preview">디자인 시스템 책 두 권</span>
        </span>
        <span class="memo__date">어제</span>
      </a>
    </section>
  </main>

  <button class="primary" type="button">
    <svg width="20" height="20" aria-hidden="true"><use href="#icon-plus"/></svg>
    새 메모 쓰기
  </button>
</div>

</body>
</html>
